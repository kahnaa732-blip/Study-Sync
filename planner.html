<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Planner | StudySync</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="dashboard-nav">
    <div class="logo">📚 StudySync</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="planner.html">Planner</a>
        <a href="schedule.html">Schedule</a>
        <a href="notes.html">Notes</a>
        <a href="timer.html">Focus Timer</a>
        <button onclick="logout()" class="logout-btn">Logout</button>
    </nav>
</header>


<main class="planner-page">

    <p class="small-title">STAY ORGANIZED</p>

    <h1>📝 Task Planner</h1>

    <p class="page-description">
        Add your assignments, study tasks and deadlines.
    </p>


    <!-- ADD TASK -->

    <div class="planner-card">

        <h2>➕ Add New Task</h2>

        <form id="taskForm">

            <div class="form-row">

                <div>
                    <label>Task Name</label>
                    <input
                        type="text"
                        id="taskName"
                        placeholder="Example: Complete Java assignment"
                        required
                    >
                </div>

                <div>
                    <label>Subject</label>
                    <input
                        type="text"
                        id="subject"
                        placeholder="Example: Java"
                        required
                    >
                </div>

            </div>


            <div class="form-row">

                <div>
                    <label>Due Date</label>
                    <input
                        type="date"
                        id="dueDate"
                        required
                    >
                </div>


                <div>
                    <label>Priority</label>

                    <select id="priority">

                        <option value="Low">
                            🟢 Low
                        </option>

                        <option value="Medium">
                            🟡 Medium
                        </option>

                        <option value="High">
                            🔴 High
                        </option>

                    </select>

                </div>

            </div>


            <button type="submit" class="primary-btn">
                Add Task
            </button>

        </form>

    </div>


    <!-- TASK LIST -->

    <div class="planner-card">

        <div class="task-header">

            <h2>📋 My Tasks</h2>

            <span id="taskCount">
                0 Tasks
            </span>

        </div>


        <div id="taskList">

            <!-- Tasks will appear here -->

        </div>


        <div id="emptyMessage" class="empty-message">

            📚 No tasks yet.<br>
            Add your first study task!

        </div>

    </div>

</main>


<script>

/* ================= LOGIN CHECK ================= */

if (
    localStorage.getItem("studySyncLoggedIn")
    !== "true"
) {
    window.location.href = "login.html";
}


/* ================= GET TASKS ================= */

let tasks =
    JSON.parse(
        localStorage.getItem("studyTasks")
    ) || [];


/* ================= FORM ================= */

document
    .getElementById("taskForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        let task = {

            id: Date.now(),

            name:
                document.getElementById("taskName")
                .value,

            subject:
                document.getElementById("subject")
                .value,

            dueDate:
                document.getElementById("dueDate")
                .value,

            priority:
                document.getElementById("priority")
                .value,

            completed: false

        };


        tasks.push(task);


        saveTasks();


        this.reset();


        alert("Task added successfully!");


        displayTasks();

    });


/* ================= SAVE ================= */

function saveTasks() {

    localStorage.setItem(
        "studyTasks",
        JSON.stringify(tasks)
    );

}


/* ================= DISPLAY ================= */

function displayTasks() {

    let taskList =
        document.getElementById("taskList");

    let emptyMessage =
        document.getElementById("emptyMessage");

    let taskCount =
        document.getElementById("taskCount");


    taskList.innerHTML = "";


    taskCount.textContent =
        tasks.length + " Tasks";


    if (tasks.length === 0) {

        emptyMessage.style.display =
            "block";

        return;

    }


    emptyMessage.style.display =
        "none";


    tasks.forEach(function(task) {

        let taskDiv =
            document.createElement("div");

        taskDiv.className =
            "task-item";


        if (task.completed) {

            taskDiv.classList.add(
                "task-completed"
            );

        }


        taskDiv.innerHTML = `

            <div class="task-info">

                <h3>
                    ${task.name}
                </h3>

                <p>
                    📚 ${task.subject}
                    &nbsp; • &nbsp;
                    📅 ${task.dueDate}
                </p>

                <span class="priority ${task.priority.toLowerCase()}">
                    ${task.priority} Priority
                </span>

            </div>


            <div class="task-actions">

                <button
                    onclick="completeTask(${task.id})"
                    class="complete-btn"
                >
                    ${task.completed ? "↩️ Undo" : "✅ Complete"}
                </button>


                <button
                    onclick="deleteTask(${task.id})"
                    class="delete-btn"
                >
                    🗑️ Delete
                </button>

            </div>

        `;


        taskList.appendChild(taskDiv);

    });

}


/* ================= COMPLETE ================= */

function completeTask(id) {

    let task =
        tasks.find(
            task => task.id === id
        );


    if (task) {

        task.completed =
            !task.completed;

        saveTasks();

        displayTasks();

    }

}


/* ================= DELETE ================= */

function deleteTask(id) {

    let confirmDelete =
        confirm(
            "Are you sure you want to delete this task?"
        );


    if (!confirmDelete) {
        return;
    }


    tasks =
        tasks.filter(
            task => task.id !== id
        );


    saveTasks();

    displayTasks();

}


/* ================= LOGOUT ================= */

function logout() {

    localStorage.removeItem(
        "studySyncLoggedIn"
    );

    window.location.href =
        "login.html";

}


/* ================= INITIAL LOAD ================= */

displayTasks();

</script>

</body>
</html>
